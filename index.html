<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мой день</title>
<style>
  :root {
    --bg: #f7f1ea;
    --card: #fffaf5;
    --text: #4a403a;
    --muted: #a89a8e;
    --accent: #8fae8b;
    --accent-soft: #dfe9dc;
    --line: #ece2d8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 18px 14px 100px;
    min-height: 100vh;
  }
  
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 8px 0 18px;
  }
  h1 {
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: 0.2px;
    margin: 0;
  }
  .header-actions {
    display: flex;
    gap: 10px;
  }
  .icon-btn {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  .icon-btn.active {
    background: var(--accent-soft);
    color: var(--text);
    border-color: var(--accent);
  }

  /* Переключатель вкладок */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    background: var(--card);
    padding: 6px;
    border-radius: 14px;
    border: 1px solid var(--line);
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    border-radius: 10px;
    font-size: 14px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--accent-soft);
    color: var(--text);
  }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    margin: 40px 0;
    line-height: 1.6;
  }
  
  /* Плашки дел */
  .task {
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 1px 3px rgba(74,64,58,0.03);
    transition: opacity 0.3s, background 0.3s;
    position: relative;
  }
  .task.cat-home { background: #fcebd6; }
  .task.cat-health { background: #e3edf3; }
  .task.cat-study { background: #ece8f2; }
  .task.cat-other { background: #fdf5d3; }
  .task.cat-work { background: #ebdce5; }

  .task.done-today { opacity: 0.6; }

  .check {
    width: 26px;
    height: 26px;
    min-width: 26px;
    border-radius: 50%;
    border: 2px solid var(--accent-soft);
    background: rgba(255,255,255,0.5);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: white;
    transition: background 0.2s, border-color 0.2s;
  }
  .check.checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .task-body { flex: 1; min-width: 0; cursor: pointer; }
  .task-name {
    font-size: 16px;
    line-height: 1.3;
    word-wrap: break-word;
  }
  .task-desc {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    display: none;
    line-height: 1.4;
  }
  .task.desc-open .task-desc { display: block; }

  .dots { display: flex; gap: 5px; margin-top: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(74,64,58,0.15); }
  .dot.filled { background: var(--accent); }

  .del {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 20px;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
    opacity: 0.5;
  }
  .del:active { opacity: 1; }

  /* Стрелочки сортировки */
  .sort-zone {
    display: none;
    flex-direction: column;
    gap: 4px;
    margin-left: 4px;
  }
  .edit-mode .sort-zone { display: flex; }
  .sort-btn {
    background: rgba(255,255,255,0.6);
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 12px;
    padding: 4px 8px;
    cursor: pointer;
    color: var(--text);
  }
  .sort-btn:active { background: var(--accent-soft); }

  .return-btn {
    background: none;
    border: 1px solid var(--muted);
    color: var(--muted);
    border-radius: 12px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    margin-left: auto;
  }

  /* Стили для простого списка */
  .list-item {
    background: var(--card);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--line);
    transition: opacity 0.3s;
  }
  .list-item.done {
    opacity: 0.5;
  }
  .list-item.done .list-item-text {
    text-decoration: line-through;
    color: var(--muted);
  }
  .list-item-text {
    flex: 1;
    font-size: 16px;
    line-height: 1.4;
    word-wrap: break-word;
    cursor: pointer;
  }

  .add-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    border: none;
    font-size: 30px;
    box-shadow: 0 4px 12px rgba(143,174,139,0.4);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
  }
  .sheet {
    position: fixed;
    inset: 0;
    background: rgba(74,64,58,0.35);
    display: none;
    align-items: flex-end;
    z-index: 10;
  }
  .sheet.open { display: flex; }
  .sheet-content {
    background: var(--card);
    width: 100%;
    border-radius: 22px 22px 0 0;
    padding: 22px 20px 30px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .sheet-content h2 { font-size: 18px; font-weight: 500; margin: 0 0 18px; }
  
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  input[type="text"], select, textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    font-size: 16px;
    color: var(--text);
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  
  .days { display: flex; gap: 6px; flex-wrap: wrap; }
  .day-btn {
    flex: 1; min-width: 38px; padding: 10px 0; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font-size: 13px; cursor: pointer;
  }
  .day-btn.active { background: var(--accent-soft); border-color: var(--accent); }
  
  .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cat-btn {
    padding: 10px 0; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 14px; cursor: pointer; text-align: center;
  }
  .cat-btn.active-home { background: #fcebd6; border-color: #e6a15c; }
  .cat-btn.active-health { background: #e3edf3; border-color: #7ba2c4; }
  .cat-btn.active-study { background: #ece8f2; border-color: #a894b8; }
  .cat-btn.active-other { background: #fdf5d3; border-color: #e6c857; }
  .cat-btn.active-work { background: #ebdce5; border-color: #b59eb3; }

  .save-btn {
    width: 100%; margin-top: 22px; padding: 15px; border-radius: 14px;
    border: none; background: var(--accent); color: white; font-size: 16px; cursor: pointer;
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>

<div class="header">
  <h1>Мой день</h1>
  <div class="header-actions">
    <button class="icon-btn" id="doneBtn" onclick="toggleView('done')">Выполнено</button>
    <button class="icon-btn" id="editBtn" onclick="toggleEditMode()">✎</button>
  </div>
</div>

<!-- Переключатель вкладок -->
<div class="tabs">
  <button class="tab-btn active" id="tabDay" onclick="switchTab('day')">Мой день</button>
  <button class="tab-btn" id="tabList" onclick="switchTab('list')">Список</button>
</div>

<div id="dayView">
  <div id="list"></div>
  <div id="empty" class="empty">Пока пусто.<br>Добавь первое дело — кнопкой «+».</div>
</div>

<div id="listView" style="display:none">
  <div id="simpleList"></div>
  <div id="simpleEmpty" class="empty">Список пуст.<br>Добавь что-нибудь — кнопкой «+».</div>
</div>

<button class="add-btn" id="addBtn" onclick="openSheet()">+</button>

<!-- Модалка для дел -->
<div class="sheet" id="sheet">
  <div class="sheet-content">
    <h2 id="sheetTitle">Новое дело</h2>

    <label>Название</label>
    <input type="text" id="name" placeholder="Например, поесть" maxlength="60">

    <label>Описание (необязательно)</label>
    <textarea id="desc" placeholder="Детали, которые не видны в общем списке..." maxlength="200"></textarea>

    <label>Категория</label>
    <div class="cat-grid" id="catRow">
      <button class="cat-btn" data-cat="home" onclick="selectCat('home')">Быт</button>
      <button class="cat-btn" data-cat="health" onclick="selectCat('health')">Здоровье</button>
      <button class="cat-btn" data-cat="study" onclick="selectCat('study')">Учёба</button>
      <button class="cat-btn" data-cat="other" onclick="selectCat('other')">Другое</button>
      <button class="cat-btn" data-cat="work" onclick="selectCat('work')">Работа</button>
    </div>

    <label>Повтор по дням</label>
    <select id="repeatType" onchange="onRepeatChange()">
      <option value="once">Один раз (на сегодня)</option>
      <option value="daily">Каждый день</option>
      <option value="weekdays">По будням</option>
      <option value="weekends">По выходным</option>
      <option value="custom">Выбранные дни</option>
      <option value="weekly">N раз в неделю (любые дни)</option>
    </select>

    <div id="customDaysWrap" style="display:none">
      <label>Дни недели</label>
      <div class="days" id="daysRow">
        <button class="day-btn" data-day="1">Пн</button>
        <button class="day-btn" data-day="2">Вт</button>
        <button class="day-btn" data-day="3">Ср</button>
        <button class="day-btn" data-day="4">Чт</button>
        <button class="day-btn" data-day="5">Пт</button>
        <button class="day-btn" data-day="6">Сб</button>
        <button class="day-btn" data-day="0">Вс</button>
      </div>
    </div>

    <div id="weeklyWrap" style="display:none">
      <label>Сколько раз в неделю</label>
      <select id="weeklyCount">
        <option>1</option><option>2</option><option>3</option>
        <option>4</option><option>5</option><option>6</option>
      </select>
    </div>

    <label>Сколько раз в день</label>
    <select id="timesPerDay">
      <option>1</option><option>2</option><option>3</option>
      <option>4</option><option>5</option>
    </select>

    <button class="save-btn" id="saveBtn" onclick="saveTask()">Сохранить</button>
  </div>
</div>

<!-- Модалка для простого списка -->
<div class="sheet" id="simpleSheet">
  <div class="sheet-content">
    <h2 id="simpleSheetTitle">Новый пункт</h2>
    <label>Текст</label>
    <input type="text" id="simpleText" placeholder="Например, купить молоко" maxlength="100">
    <button class="save-btn" onclick="saveSimpleItem()">Сохранить</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'myday_tasks_v1';
const SIMPLE_LIST_KEY = 'myday_simple_list_v1';
let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let simpleList = JSON.parse(localStorage.getItem(SIMPLE_LIST_KEY) || '[]');
let currentCat = 'home';
let editMode = false;
let currentView = 'active';
let editingTaskId = null;
let editingSimpleId = null;
let currentTab = 'day';

function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
function saveSimple() { localStorage.setItem(SIMPLE_LIST_KEY, JSON.stringify(simpleList)); }

function getDoneToday(task) {
  const key = todayKey();
  return (task.done && task.done[key]) || 0;
}

function setDoneToday(task, count) {
  if (!task.done) task.done = {};
  const key = todayKey();
  if (count <= 0) { delete task.done[key]; } else { task.done[key] = count; }
  save();
}

function getWeekCount(task) {
  const now = new Date();
  const day = now.getDay() === 0 ? 7 : now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (day - 1));
  let count = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    if (task.done && task.done[key]) count += task.done[key];
  }
  return count;
}

function isActiveToday(task) {
  const today = todayKey();
  if (task.repeatType === 'once') {
    if (task.targetDate && task.targetDate !== today) return false;
    return getDoneToday(task) < (task.timesPerDay || 1);
  }
  
  const day = new Date().getDay();
  if (task.repeatType === 'daily') return true;
  if (task.repeatType === 'weekdays') return day >= 1 && day <= 5;
  if (task.repeatType === 'weekends') return day === 0 || day === 6;
  if (task.repeatType === 'custom') return task.customDays.includes(day);
  if (task.repeatType === 'weekly') return true;
  return true;
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabDay').classList.toggle('active', tab === 'day');
  document.getElementById('tabList').classList.toggle('active', tab === 'list');
  document.getElementById('dayView').style.display = tab === 'day' ? 'block' : 'none';
  document.getElementById('listView').style.display = tab === 'list' ? 'block' : 'none';
  
  // Сбрасываем режимы при переключении
  editMode = false;
  currentView = 'active';
  render();
}

function toggleView(view) {
  if (view === 'done') {
    if (currentView === 'done') { currentView = 'active'; } else { currentView = 'done'; }
  } else {
    currentView = 'active';
  }
  render();
}

function toggleEditMode() {
  editMode = !editMode;
  if (editMode && currentView === 'done') currentView = 'active';
  render();
}

function moveTask(index, direction) {
  const newIndex = index + direction;
  if (newIndex < 0 || newIndex >= tasks.length) return;
  const temp = tasks[index];
  tasks[index] = tasks[newIndex];
  tasks[newIndex] = temp;
  save();
  render();
}

function moveSimpleItem(index, direction) {
  const newIndex = index + direction;
  if (newIndex < 0 || newIndex >= simpleList.length) return;
  const temp = simpleList[index];
  simpleList[index] = simpleList[newIndex];
  simpleList[newIndex] = temp;
  saveSimple();
  render();
}

function openEditSheet(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  
  editingTaskId = id;
  document.getElementById('sheetTitle').textContent = 'Редактировать дело';
  document.getElementById('name').value = task.name;
  document.getElementById('desc').value = task.desc || '';
  document.getElementById('repeatType').value = task.repeatType;
  document.getElementById('timesPerDay').value = task.timesPerDay || 1;
  document.getElementById('weeklyCount').value = task.weeklyCount || 3;
  
  selectCat(task.cat || 'home');
  
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
  if (task.repeatType === 'custom' && task.customDays) {
    task.customDays.forEach(d => {
      const btn = document.querySelector(`.day-btn[data-day="${d}"]`);
      if (btn) btn.classList.add('active');
    });
  }

  onRepeatChange();
  sheet.classList.add('open');
}

function render() {
  document.getElementById('editBtn').className = 'icon-btn' + (editMode ? ' active' : '');
  document.getElementById('doneBtn').className = 'icon-btn' + (currentView === 'done' ? ' active' : '');
  document.getElementById('addBtn').style.display = editMode ? 'none' : 'flex';

  if (currentTab === 'day') {
    renderDayView();
  } else {
    renderSimpleList();
  }
}

function renderDayView() {
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  list.innerHTML = '';
  
  let visible = [];
  
  if (currentView === 'done') {
    visible = tasks.filter(t => {
      const max = t.timesPerDay || 1;
      return getDoneToday(t) >= max;
    });
  } else {
    visible = tasks.filter(t => {
      if (!isActiveToday(t)) return false;
      if (t.repeatType === 'weekly') return getWeekCount(t) < t.weeklyCount;
      return getDoneToday(t) < (t.timesPerDay || 1);
    });
  }

  if (visible.length === 0) {
    empty.style.display = 'block';
    empty.innerHTML = currentView === 'done' 
      ? 'На сегодня выполненных дел пока нет.'
      : 'Пока пусто.<br>Добавь первое дело — кнопкой «+».';
  } else {
    empty.style.display = 'none';
  }

  visible.forEach(task => {
    const done = getDoneToday(task);
    const max = task.timesPerDay || 1;
    const cat = task.cat || 'other';
    const realIndex = tasks.findIndex(t => t.id === task.id);
    
    const el = document.createElement('div');
    el.className = 'task cat-' + cat;
    if (currentView === 'done') el.classList.add('done-today');
    if (editMode) el.classList.add('edit-mode');

    if (currentView === 'active') {
      const check = document.createElement('div');
      check.className = 'check' + (done >= max ? ' checked' : '');
      if (done >= max) check.textContent = '✓';
      check.onclick = (e) => {
        e.stopPropagation();
        const next = done + 1;
        setDoneToday(task, next >= max ? max : next);
        render();
      };
      el.appendChild(check);
    }

    const body = document.createElement('div');
    body.className = 'task-body';
    body.onclick = () => {
      if (editMode) {
        openEditSheet(task.id);
      } else {
        el.classList.toggle('desc-open');
      }
    };

    const name = document.createElement('div');
    name.className = 'task-name';
    name.textContent = task.name;
    body.appendChild(name);

    if (task.desc) {
      const desc = document.createElement('div');
      desc.className = 'task-desc';
      desc.textContent = task.desc;
      body.appendChild(desc);
    }

    if (max > 1 && currentView === 'active') {
      const dots = document.createElement('div');
      dots.className = 'dots';
      for (let i = 0; i < max; i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i < done ? ' filled' : '');
        dots.appendChild(d);
      }
      body.appendChild(dots);
    }
    el.appendChild(body);

    if (currentView === 'done') {
      const ret = document.createElement('button');
      ret.className = 'return-btn';
      ret.textContent = 'Вернуть';
      ret.onclick = (e) => {
        e.stopPropagation();
        setDoneToday(task, 0);
        render();
      };
      el.appendChild(ret);
    }

    if (editMode && currentView === 'active') {
      const sortZone = document.createElement('div');
      sortZone.className = 'sort-zone';
      
      const up = document.createElement('button');
      up.className = 'sort-btn';
      up.textContent = '↑';
      up.onclick = (e) => { e.stopPropagation(); moveTask(realIndex, -1); };
      
      const down = document.createElement('button');
      down.className = 'sort-btn';
      down.textContent = '↓';
      down.onclick = (e) => { e.stopPropagation(); moveTask(realIndex, 1); };
      
      sortZone.appendChild(up);
      sortZone.appendChild(down);
      el.appendChild(sortZone);
    }

    if (!editMode && currentView === 'active') {
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.onclick = (e) => {
        e.stopPropagation();
        if (confirm('Удалить «' + task.name + '»?')) {
          tasks = tasks.filter(t => t.id !== task.id);
          save(); render();
        }
      };
      el.appendChild(del);
    }

    list.appendChild(el);
  });
}

function renderSimpleList() {
  const list = document.getElementById('simpleList');
  const empty = document.getElementById('simpleEmpty');
  list.innerHTML = '';

  if (simpleList.length === 0) {
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
  }

  simpleList.forEach((item, index) => {
    const el = document.createElement('div');
    el.className = 'list-item' + (item.done ? ' done' : '');

    const check = document.createElement('div');
    check.className = 'check' + (item.done ? ' checked' : '');
    if (item.done) check.textContent = '✓';
    check.onclick = (e) => {
      e.stopPropagation();
      item.done = !item.done;
      saveSimple();
      render();
    };
    el.appendChild(check);

    const text = document.createElement('div');
    text.className = 'list-item-text';
    text.textContent = item.text;
    text.onclick = () => {
      if (editMode) {
        openSimpleEditSheet(item.id);
      }
    };
    el.appendChild(text);

    if (editMode) {
      const sortZone = document.createElement('div');
      sortZone.className = 'sort-zone';
      sortZone.style.display = 'flex';
      
      const up = document.createElement('button');
      up.className = 'sort-btn';
      up.textContent = '↑';
      up.onclick = (e) => { e.stopPropagation(); moveSimpleItem(index, -1); };
      
      const down = document.createElement('button');
      down.className = 'sort-btn';
      down.textContent = '↓';
      down.onclick = (e) => { e.stopPropagation(); moveSimpleItem(index, 1); };
      
      sortZone.appendChild(up);
      sortZone.appendChild(down);
      el.appendChild(sortZone);
    }

    if (!editMode) {
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '×';
      del.onclick = (e) => {
        e.stopPropagation();
        if (confirm('Удалить «' + item.text + '»?')) {
          simpleList = simpleList.filter(i => i.id !== item.id);
          saveSimple();
          render();
        }
      };
      el.appendChild(del);
    }

    list.appendChild(el);
  });
}

const sheet = document.getElementById('sheet');
const simpleSheet = document.getElementById('simpleSheet');

function openSheet() {
  if (currentTab === 'list') {
    openSimpleSheet();
    return;
  }
  
  editingTaskId = null;
  document.getElementById('sheetTitle').textContent = 'Новое дело';
  document.getElementById('name').value = '';
  document.getElementById('desc').value = '';
  document.getElementById('repeatType').value = 'daily';
  document.getElementById('timesPerDay').value = '1';
  document.getElementById('weeklyCount').value = '3';
  document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
  selectCat('home');
  onRepeatChange();
  sheet.classList.add('open');
  setTimeout(() => document.getElementById('name').focus(), 100);
}

function openSimpleSheet() {
  editingSimpleId = null;
  document.getElementById('simpleSheetTitle').textContent = 'Новый пункт';
  document.getElementById('simpleText').value = '';
  simpleSheet.classList.add('open');
  setTimeout(() => document.getElementById('simpleText').focus(), 100);
}

function openSimpleEditSheet(id) {
  const item = simpleList.find(i => i.id === id);
  if (!item) return;
  
  editingSimpleId = id;
  document.getElementById('simpleSheetTitle').textContent = 'Редактировать';
  document.getElementById('simpleText').value = item.text;
  simpleSheet.classList.add('open');
  setTimeout(() => document.getElementById('simpleText').focus(), 100);
}

function closeSheet() { sheet.classList.remove('open'); }
function closeSimpleSheet() { simpleSheet.classList.remove('open'); }

sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });
simpleSheet.addEventListener('click', (e) => { if (e.target === simpleSheet) closeSimpleSheet(); });

function onRepeatChange() {
  const v = document.getElementById('repeatType').value;
  document.getElementById('customDaysWrap').style.display = v === 'custom' ? 'block' : 'none';
  document.getElementById('weeklyWrap').style.display = v === 'weekly' ? 'block' : 'none';
}

function selectCat(cat) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.className = 'cat-btn';
    if (btn.dataset.cat === cat) btn.classList.add('active-' + cat);
  });
}

document.querySelectorAll('.day-btn').forEach(btn => {
  btn.onclick = () => btn.classList.toggle('active');
});

function saveTask() {
  const name = document.getElementById('name').value.trim();
  if (!name) { alert('Напиши название дела'); return; }
  const desc = document.getElementById('desc').value.trim();
  const repeatType = document.getElementById('repeatType').value;
  const timesPerDay = parseInt(document.getElementById('timesPerDay').value);
  const weeklyCount = parseInt(document.getElementById('weeklyCount').value);
  const customDays = Array.from(document.querySelectorAll('.day-btn.active')).map(b => parseInt(b.dataset.day));

  if (repeatType === 'custom' && customDays.length === 0) {
    alert('Выбери хотя бы один день'); return;
  }

  const targetDate = repeatType === 'once' ? todayKey() : null;

  if (editingTaskId) {
    const task = tasks.find(t => t.id === editingTaskId);
    if (task) {
      task.name = name;
      task.desc = desc;
      task.cat = currentCat;
      task.repeatType = repeatType;
      task.customDays = customDays;
      task.weeklyCount = weeklyCount;
      task.timesPerDay = timesPerDay;
      task.targetDate = targetDate;
    }
  } else {
    tasks.push({
      id: Date.now() + '_' + Math.random().toString(36).slice(2,7),
      name, desc, cat: currentCat,
      repeatType, customDays, weeklyCount, timesPerDay, targetDate,
      done: {}
    });
  }
  save(); closeSheet(); render();
}

function saveSimpleItem() {
  const text = document.getElementById('simpleText').value.trim();
  if (!text) { alert('Напиши текст'); return; }

  if (editingSimpleId) {
    const item = simpleList.find(i => i.id === editingSimpleId);
    if (item) {
      item.text = text;
    }
  } else {
    simpleList.push({
      id: Date.now() + '_' + Math.random().toString(36).slice(2,7),
      text: text,
      done: false
    });
  }
  saveSimple();
  closeSimpleSheet();
  render();
}

render();
</script>
</body>
</html>
